name: Eksport do Excela

on:
  workflow_dispatch:
  schedule:
    # Kopia zapasowa w kazdy poniedzialek o 6:00 UTC.
    - cron: "0 6 * * 1"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Zbuduj arkusz
        run: python3 scripts/export_xlsx.py Kolekcja_gier.xlsx

      - uses: actions/upload-artifact@v4
        with:
          name: kolekcja-gier-xlsx
          path: Kolekcja_gier.xlsx
          retention-days: 90
