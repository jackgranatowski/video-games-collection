name: Walidacja kolekcji

on:
  push:
    paths:
      - "data/games.csv"
      - "data/metadata.csv"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/games.csv"
      - "data/metadata.csv"
      - "scripts/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sprawdź data/games.csv
        run: python3 scripts/validate.py

      - name: Sprawdź, czy strona się buduje
        run: python3 scripts/build_site.py
