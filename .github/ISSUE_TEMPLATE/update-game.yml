name: "✏️ Zmień grę"
description: "Zmień dane gry, która już jest w kolekcji. Puste pola zostają bez zmian."
title: "Zmień: "
labels: ["update-game"]
body:
  - type: markdown
    attributes:
      value: "Podaj dokładny tytuł z kolekcji. Wypełnij tylko te pola, które mają się zmienić."

  - type: input
    id: title
    attributes:
      label: Tytuł (dokładnie jak w kolekcji)
      placeholder: "Elden Ring"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Nowy status
      options:
        - "bez zmian"
        - "backlog — do ogrania"
        - "playing — ogrywam teraz"
        - "want_to_try — chcę tylko spróbować"
        - "upcoming — przed premierą"
        - "limbo — zainteresowany, nie pali się"
        - "completed — ukończone"
        - "played — ograne, nieukończone"
        - "not_interested — nie interesuje mnie"

  - type: input
    id: year
    attributes:
      label: Rok premiery

  - type: input
    id: platforms
    attributes:
      label: Platformy
      description: "Zastępuje poprzednią wartość. Kilka oddziel średnikiem."

  - type: dropdown
    id: owned
    attributes:
      label: Mam?
      options: ["bez zmian", "yes — mam", "no — nie mam"]

  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      options: ["bez zmian", "high — priorytetowo", "normal — na pewno, bez pośpiechu", "someday — kiedyś", "skip — olewam"]

  - type: dropdown
    id: vr
    attributes:
      label: VR
      options: ["bez zmian", "no — bez VR", "yes — VR dostępne", "optional — VR opcjonalne", "required — tylko VR"]

  - type: input
    id: rating
    attributes:
      label: Ocena 1-5

  - type: input
    id: finished_year
    attributes:
      label: Rok ukończenia

  - type: input
    id: hype
    attributes:
      label: Hype 1-10

  - type: dropdown
    id: review
    attributes:
      label: Recenzja
      options: ["bez zmian", "todo — do napisania", "done — jest", "not_needed — nie trzeba"]

  - type: dropdown
    id: blog
    attributes:
      label: Dodane na blogu?
      options: ["bez zmian", "yes — tak", "no — nie"]

  - type: input
    id: tags
    attributes:
      label: Tagi
      description: "Zastępuje poprzednią wartość. Kilka oddziel średnikiem."

  - type: input
    id: notes
    attributes:
      label: Notatki
